<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Férová studentská seznamka s ověřením identity, férovým párováním a šifrovanou komunikací." />

  <!-- Favicon -->
  <link rel="icon" href="assets/images/nahled.png" type="image/png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/style.css" />

  <title>brndr</title>
</head>
<body>

  <!-- ── Navigation ───────────────────────────────────────── -->
  <nav id="site-nav" role="navigation" aria-label="Hlavní navigace">
    <div class="container">
      <a href="#hero" class="nav-logo">brndr</a>
      <ul class="nav-links"></ul>
      <a href="#signup" class="nav-cta">Zaregistrovat se</a>
      <button class="nav-toggle" aria-label="Otevřít menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- ── Hero ─────────────────────────────────────────────── -->
  <section id="hero">
    <div class="container">
      <div class="hero-content" data-reveal>
        <img class="hero-logo-img" src="assets/images/nahled.png" alt="brndr logo" />
        <span class="hero-eyebrow"></span>
        <h1 class="hero-headline"></h1>
        <p class="hero-subline"></p>
        <div class="hero-cta-group">
          <a class="hero-cta" target="_blank" rel="noopener"></a>
          <a class="hero-demo-cta" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- ── Features ─────────────────────────────────────────── -->
  <section id="features">
    <div class="container">
      <span class="section-label" data-reveal></span>
      <h2 class="section-heading" data-reveal></h2>
      <div class="features-list" data-reveal></div>
    </div>
  </section>

  <!-- ── About ────────────────────────────────────────────── -->
  <section id="about">
    <div class="container">
      <div class="about-inner" data-reveal>
        <span class="section-label"></span>
        <h2 class="section-heading"></h2>
        <div class="about-text"></div>
        <div class="about-stats"></div>
      </div>
    </div>
  </section>

  <!-- ── Signup ───────────────────────────────────────────── -->
  <section id="signup">
    <div class="container">
      <div class="signup-inner" data-reveal>
        <span class="section-label"></span>
        <h2 class="section-heading"></h2>
        <p class="signup-subline"></p>
        <a class="signup-cta" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </section>

  <!-- ── Footer ───────────────────────────────────────────── -->
  <footer id="site-footer">
    <div class="container">
      <p class="footer-copy"></p>
      <ul class="footer-socials"></ul>
    </div>
  </footer>

  <!-- ── Scripts ──────────────────────────────────────────── -->
  <!-- content.js must load before app.js (it defines SITE) -->
  <script src="assets/js/content.js"></script>
  <script src="assets/js/app.js"></script>

</body>
</html>
